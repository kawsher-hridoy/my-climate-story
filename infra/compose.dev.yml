name: nasa-climate-dev
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: climate_dev_password
      POSTGRES_DB: climate
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["climate-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climate -d climate"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  climate-db:
